# Step Configuration Prefab — CarriageBuild
# ==========================================
# Linear bearing carriage assembled from two halves with bearing seating,
# shake test, rod-slide test, bolt placement, and torque finish.
#
# This is the YAML port of generate_steps.py:template_bearing_carriage.
# Both implementations must produce equivalent step JSON for identical inputs.
#
# Prefab schema:
#   prefab        — unique prefab name (used in instantiation YAMLs)
#   description   — short summary, shown in catalog and TTAW dropdown
#   roles         — slots the instantiator must fill with partIds
#                     kind=part         single partId (string)
#                     kind=part_list    array of partIds (with optional fixed count)
#   options       — knobs the instantiator may override; defaults shown
#   derived       — computed roles (e.g. concat of two list roles)
#   steps         — ordered step templates; rendered with the substitution context
#
# String substitution (any string field):
#   {role}        — value of role (single partId, option value, etc.)
#   {role.count}  — length of a list role
#   plain text passes through; literal { } not currently supported
#
# Array-of-references substitution (requiredPartIds, optionalPartIds, etc.):
#   "{role}"      — insert single role value
#   "*{role}"     — expand list role inline
#   any other string is a literal and passes through unchanged
#
# Step IDs are prefixed at instantiation time:
#   final id = "step_{instance.prefix}_{step.id_suffix}"

prefab: CarriageBuild
description: "Linear bearing carriage from two halves — shake + rod-slide tested, cross-pattern torqued."

roles:
  half_a:
    kind: part
    description: "First carriage half — receives the bearings."
  half_b:
    kind: part
    description: "Closing carriage half."
  bearings:
    kind: part_list
    count: 4
    description: "LM8UU linear bearings, flanges outward."
  bolts_top:
    kind: part_list
    count: 2
    description: "Short bolts (M6×18) — top of carriage."
  bolts_bot:
    kind: part_list
    count: 2
    description: "Long bolts (M6×30) — bottom of carriage."
  nuts:
    kind: part_list
    count: 4
    description: "M6 nuts — finger-tightened then torqued."

options:
  orientation_cue:
    type: string
    default: "flanges facing outward"
    description: "Bearing orientation hint included in the place-bearings instruction."
  tool:
    type: string
    default: "tool_power_drill"
    description: "Tool used for the final torque step."
  torque_setting:
    type: string
    default: "lowest"
    description: "Torque setting passed to the final step's instruction text."
  milestone:
    type: string
    default: "Carriage assembly complete."
    description: "Milestone message shown on the final step."

derived:
  all_bolts:
    kind: part_list
    combine: [bolts_top, bolts_bot]
    description: "All carriage bolts concatenated (top first, bottom second)."

steps:
  - id_suffix: place_bearings
    family: Place
    name: "Seat {bearings.count} Bearings in Carriage Half A"
    requiredPartIds:
      - "{half_a}"
      - "*{bearings}"
    guidance:
      instructionText: "Place all {bearings.count} LM8UU linear bearings into carriage half A ({half_a}). Orient each bearing with {orientation_cue}."
      whyItMattersText: "Flanges prevent axial migration of bearings under load. An inverted bearing will walk out of its pocket within the first few print cycles."
    validation:
      successCriteria: "All {bearings.count} bearings seated flush. Flanges visible on both sides of each pocket."
      failureCriteria: "Any bearing recessed, flipped, or able to rock in its pocket."
    feedback:
      successMessage: "Bearings seated correctly — ready to close the carriage."
      failureMessage: "Re-seat any loose or inverted bearings before closing."

  - id_suffix: close_halves
    family: Place
    name: "Close Carriage Half B — Align Belt Holes"
    requiredPartIds:
      - "{half_a}"
      - "{half_b}"
    guidance:
      instructionText: "Press carriage half B ({half_b}) firmly against half A, trapping all {bearings.count} bearings. Align so the small ribbed belt hole sits beside the large smooth belt hole — this is the ONLY correct orientation."
      whyItMattersText: "Belt-hole alignment must be confirmed before bolting. If small-ribbed ≠ beside large-smooth, the peg holes misalign and the belt cannot thread through."
    validation:
      successCriteria: "Both halves flush along the full seam. Small ribbed hole is directly beside the large smooth hole."
      failureCriteria: "Gap visible along seam, or belt holes on wrong sides relative to each other."
    feedback:
      successMessage: "Halves closed and belt holes aligned."
      failureMessage: "Flip half B 180° and retry — small ribbed hole must be adjacent to the large smooth hole."

  - id_suffix: shake_test
    family: Confirm
    name: "Shake Test — Bearing Retention Check"
    requiredPartIds:
      - "{half_a}"
      - "{half_b}"
    guidance:
      instructionText: "Hold both halves compressed firmly by hand — do not bolt yet. Shake the closed assembly firmly for 2–3 seconds. Listen and feel for any bearing rattle or movement."
      whyItMattersText: "A rattle means at least one bearing is not fully seated in its pocket. Bolting before fixing locks in the defect — the carriage will develop play under load and the axis will lose positional accuracy."
    validation:
      successCriteria: "No audible rattle, no felt movement from bearings while halves are hand-compressed."
      failureCriteria: "Any rattle, clicking, or loose feeling during the shake."
    feedback:
      successMessage: "Shake test passed — bearings are solid."
      failureMessage: "Open the halves and identify the loose bearing. Re-seat it and retest before proceeding."

  - id_suffix: rod_slide_test
    family: Confirm
    name: "Rod Slide Test — Bearing Alignment Check"
    requiredPartIds:
      - "{half_a}"
      - "{half_b}"
    guidance:
      instructionText: "While still holding halves compressed, slide a smooth 8mm rod vertically through all {bearings.count} bearings. It should pass with slight, even resistance — not too stiff, not freely loose."
      whyItMattersText: "Uneven resistance exposes bearing misalignment. If left uncorrected, the axis will bind under motor load and cause missed steps or stalls."
    validation:
      successCriteria: "Rod slides through all {bearings.count} bearings with slight, consistent resistance. No binding or tight spots."
      failureCriteria: "Rod catches or sticks at any bearing, OR drops through with zero resistance."
    feedback:
      successMessage: "Rod slide test passed — bearings aligned."
      failureMessage: "Open halves. Check that all bearings are fully seated and coplanar. Re-close and retest."

  - id_suffix: place_bolts
    family: Place
    name: "Insert Bolts and Thread {nuts.count} Nuts Finger-Tight"
    requiredPartIds:
      - "*{all_bolts}"
      - "*{nuts}"
    guidance:
      instructionText: "Insert the {bolts_top.count} shorter M6×18 bolts through the TOP holes and the {bolts_bot.count} longer M6×30 bolts through the BOTTOM holes. Thread all {nuts.count} M6 nuts finger-tight — hand only, no drill yet."
      whyItMattersText: "Short bolts top, long bolts bottom — this is the load-distribution pattern. Swapping them puts longer threads in the high-stress joint, which can strip faster under Y-axis acceleration."
    validation:
      successCriteria: "All {all_bolts.count} bolts inserted and {nuts.count} nuts threaded finger-tight. Short M6×18 bolts are in the top holes, long M6×30 in the bottom holes."
      failureCriteria: "Wrong bolt length in wrong hole, any nut cross-threaded, or any bolt not yet threaded."
    feedback:
      successMessage: "Bolts and nuts placed correctly — ready to tighten."
      failureMessage: "Verify bolt lengths: M6×18 (shorter) → top holes, M6×30 (longer) → bottom holes."

  - id_suffix: tighten
    family: Use
    name: "Tighten Carriage Bolts — Cross Pattern"
    requiredPartIds:
      - "*{all_bolts}"
    requiredToolActions:
      - toolId: "{tool}"
        actionType: Tighten
        profile: Torque
    guidance:
      instructionText: "Using the power drill at {torque_setting} torque setting, tighten all {all_bolts.count} carriage bolts in a cross pattern: top-left → bottom-right → top-right → bottom-left. Repeat the pattern once to equalize clamping."
      whyItMattersText: "Cross-pattern tightening ensures even clamping force across the carriage body. Sequential (one side first) tightening distorts the bearing bores and causes axis binding."
    validation:
      successCriteria: "All {all_bolts.count} bolts tight at {torque_setting} torque. Carriage halves fully closed — no gap along seam. Rod still slides smoothly through bearings after tightening. {milestone}"
      failureCriteria: "Any bolt loose, gap visible between halves, or rod now binds after tightening."
    feedback:
      successMessage: "{milestone}"
      failureMessage: "If rod now binds: back off all bolts ¼ turn, re-run cross pattern at lower torque. If gap persists: check for bearing oversize or debris between halves."
